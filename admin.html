<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWER HOUSE - Admin</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.box {
    max-width: 400px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 2px 15px #ddd;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">
    <h1>🌸 FLOWER HOUSE</h1>
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBCOZQu9uFDuQE0SqCUK0t-yFfkaMz57cQ",
    authDomain: "flower-house-53227.firebaseapp.com",
    projectId: "flower-house-53227",
    storageBucket: "flower-house-53227.firebasestorage.app",
    messagingSenderId: "434415503843",
    appId: "1:434415503843:web:cbbf2fd16dabc70812f8d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.innerText = "Login successful ✅";

        setTimeout(function() {
            window.location.href = "admin-panel.html";
        }, 1000);

    

       
    }
};

</script>

</body>
</html>
