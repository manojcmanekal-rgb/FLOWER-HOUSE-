<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOWER HOUSE - ಹೂವಿನ ಮನೆ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffafc;
      color: #222;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 8px #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 15px;
    }

    .search {
      margin: 20px;
    }

    .search input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    h2 {
      margin: 20px;
    }

    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px;
    }

    .category {
      min-width: 90px;
      background: white;
      padding: 15px 10px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 2px 8px #eee;
    }

    .flowers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 0 20px 30px;
    }

    .flower {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 2px 8px #eee;
    }

    .flower-image {
      height: 120px;
      background: #ffe5ef;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .flower h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌸 FLOWER HOUSE</h1>
    <p>ಹೂವಿನ ಮನೆ</p>
  </header>

  <div class="search">
    <input type="text" placeholder="🔍 ಹೂವು ಹುಡುಕಿ">
  </div>
<div style="text-align:center;margin:15px 0;">
  <button type="button" onclick="alert('Kannada button working')">ಕನ್ನಡ</button>
<button type="button" onclick="setLanguage('en')">English</button>
<button type="button" onclick="setLanguage('hi')">हिंदी</button>
</div>
  <h2>ವಿಭಾಗಗಳು</h2>

  <div class="categories">
    <div class="category">🌹<br>Roses</div>
    <div class="category">💐<br>Bouquets</div>
    <div class="category">🌼<br>Garlands</div>
    <div class="category">🌸<br>Jasmine</div>
  </div>

  <h2>ಜನಪ್ರಿಯ ಹೂವುಗಳು</h2>

  <div class="flowers">

    <div class="flower">
      <div class="flower-image">🌹</div>
      <h3>Red Roses</h3>
      <div class="price">₹199</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">💐</div>
      <h3>Beautiful Bouquet</h3>
      <div class="price">₹399</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">🌼</div>
      <h3>Flower Garland</h3>
      <div class="price">₹149</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">🌸</div>
      <h3>Jasmine</h3>
      <div class="price">₹99</div>
      <button>Add to Cart</button>
    </div>
<div class="flower">
  <div class="flower-image">🌺</div>
  <h3>ದೇವಸ್ಥಾನದ ಹೂವು - 1 ಮೊಳ</h3>
  <div class="price">₹199</div>
  <button>Add to Cart</button>
</div>

<div class="flower">
  <div class="flower-image">🌺</div>
  <h3>ದೇವಸ್ಥಾನದ ಹೂವು - 2 ಮೊಳ</h3>
  <div class="price">₹349</div>
  <button>Add to Cart</button>
</div>
  </div>
  <div style="padding:20px;">
  <h2>ಆರ್ಡರ್ ವಿವರಗಳು</h2>

  <input id="customerName" type="text" placeholder="ನಿಮ್ಮ ಹೆಸರು"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;">

  <input id="customerPhone" type="tel" placeholder="ಮೊಬೈಲ್ ನಂಬರ್"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;">

  <textarea id="customerAddress" placeholder="ಡೆಲಿವರಿ ವಿಳಾಸ"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;"></textarea>
</div>
<a id="orderButton" href="https://wa.me/916362993413"
style="display:block;text-align:center;background:#25D366;color:white;padding:15px;margin:20px;border-radius:10px;">
📱 Order on WhatsApp
</a>
 </a>

<div id="totalAmount" style="text-align:center;font-size:20px;font-weight:bold;margin:15px 0;">
Total Amount: ₹0
</div>

<script> 

let cart = [];

document.querySelectorAll(".flower").forEach(function(flower) {

    const button = flower.querySelector("button");
    const name = flower.querySelector("h3").innerText;
    const priceText = flower.querySelector(".price").innerText;
    const price = parseInt(priceText.replace(/\D/g, ""));

    const quantityBox = document.createElement("div");
    quantityBox.style.cssText =
        "display:flex;justify-content:center;align-items:center;gap:15px;margin:10px 0;";

    quantityBox.innerHTML =
        '<button type="button" class="minus">−</button>' +
        '<span class="quantity">0</span>' +
        '<button type="button" class="plus">+</button>';

    button.parentNode.insertBefore(quantityBox, button);

    const quantity = quantityBox.querySelector(".quantity");

    quantityBox.querySelector(".plus").addEventListener("click", function() {
        quantity.innerText = parseInt(quantity.innerText) + 1;
    });

    quantityBox.querySelector(".minus").addEventListener("click", function() {
        let q = parseInt(quantity.innerText);
        if (q > 0) {
            quantity.innerText = q - 1;
        }
    });

    button.addEventListener("click", function() {

        const qty = parseInt(quantity.innerText);

        const existing = cart.find(function(item) {
            return item.name === name;
        });

        if (existing) {
            existing.quantity += qty;
        } else {
            cart.push({
                name: name,
                price: price,
                quantity: qty
            });
        }
let displayTotal = 0;

cart.forEach(function(item) {
    displayTotal += item.price * item.quantity;
});

document.getElementById("totalAmount").innerText =
    "Total Amount: ₹" + displayTotal;
      function updateCartSummary() {
    let summary = document.getElementById("cartSummary");

    if (!summary) {
        summary = document.createElement("div");
        summary.id = "cartSummary";
        summary.style = "padding:20px;margin:20px 0;background:#f5f5f5;border-radius:15px;";
        document.getElementById("orderButton").parentNode.insertBefore(
            summary,
            document.getElementById("orderButton")
        );
    }

    let html = "<h2>🛒 Cart Summary</h2>";

    cart.forEach(function(item) {
        html += "<p>" + item.name + " × " + item.quantity +
                " = ₹" + (item.price * item.quantity) + "</p>";
    });

    html += "<h3>💰 Total: ₹" + displayTotal + "</h3>";

    summary.innerHTML = html;
}

updateCartSummary();
        button.innerText = "Added ✓";
        button.style.background = "#25D366";
    });
});


document.getElementById("orderButton").addEventListener("click", function(e) {

    e.preventDefault();

    if (cart.length === 0) {
        alert("ಮೊದಲು ಒಂದು Flower Add to Cart ಮಾಡಿ ❤️");
        return;
    }

    const customerName =
        document.getElementById("customerName").value.trim();

    const customerPhone =
        document.getElementById("customerPhone").value.trim();

    const customerAddress =
        document.getElementById("customerAddress").value.trim();

    if (!customerName || !customerPhone || !customerAddress) {
        alert("ಹೆಸರು, ಮೊಬೈಲ್ ನಂಬರ್ ಮತ್ತು ವಿಳಾಸ ಹಾಕಿ ❤️");
        return;
    }

    let message = "🌸 FLOWER HOUSE ORDER 🌸\n\n";

    message += "👤 ಹೆಸರು: " + customerName + "\n";
    message += "📱 ಮೊಬೈಲ್: " + customerPhone + "\n";
    message += "📍 ವಿಳಾಸ: " + customerAddress + "\n\n";

    let total = 0;

    cart.forEach(function(item, index) {

        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        message +=
            (index + 1) + ". " +
            item.name +
            " × " +
            item.quantity +
            " - ₹" +
            itemTotal +
            "\n";
    });

    message += "\n💰 Total Amount: ₹" + total;
    message += "\n\n❤️ Thank you for ordering!";

    window.location.href =
        "https://wa.me/916362993413?text=" +
        encodeURIComponent(message);
});
function setLanguage(lang) {
alert("Button working: " + lang);
    const text = {

        kn: {
            title: "🌸 FLOWER HOUSE",
            subtitle: "ಹೂವಿನ ಮನೆ",
            search: "🔍 ಹೂವು ಹುಡುಕಿ",
            categories: "ವಿಭಾಗಗಳು",
            flowers: "ಜನಪ್ರಿಯ ಹೂವುಗಳು",
            roses: "ಗುಲಾಬಿಗಳು",
            bouquets: "ಹೂಗುಚ್ಛಗಳು",
            garlands: "ಹೂಮಾಲೆಗಳು",
            jasmine: "ಮಲ್ಲಿಗೆ",
            redRoses: "ಕೆಂಪು ಗುಲಾಬಿಗಳು",
            beautifulBouquet: "ಸುಂದರ ಹೂಗುಚ್ಛ",
            flowerGarland: "ಹೂಮಾಲೆ",
            add: "ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಿ"
        },

        en: {
            title: "🌸 FLOWER HOUSE",
            subtitle: "Flower House",
            search: "🔍 Search flowers",
            categories: "Categories",
            flowers: "Popular Flowers",
            roses: "Roses",
            bouquets: "Bouquets",
            garlands: "Garlands",
            jasmine: "Jasmine",
            redRoses: "Red Roses",
            beautifulBouquet: "Beautiful Bouquet",
            flowerGarland: "Flower Garland",
            add: "Add to Cart"
        },

        hi: {
            title: "🌸 FLOWER HOUSE",

            search: "🔍 फूल खोजें",
            categories: "श्रेणियाँ",
            flowers: "लोकप्रिय फूल",
            roses: "गुलाब",
            bouquets: "गुलदस्ते",
            garlands: "मालाएँ",
            jasmine: "चमेली",
            redRoses: "लाल गुलाब",
            beautifulBouquet: "सुंदर गुलदस्ता",
            flowerGarland: "फूलों की माला",
            add: "कार्ट में जोड़ें"
        }
    };

    const t = text[lang];

    document.querySelector("header h1").innerText = t.title;
    document.querySelector("header p").innerText = t.subtitle;

    document.querySelector(".search input").placeholder = t.search;

    document.querySelectorAll("h2")[0].innerText = t.categories;
    document.querySelectorAll("h2")[1].innerText = t.flowers;

    const categories = document.querySelectorAll(".category");

    categories[0].innerHTML = "🌹<br>" + t.roses;
    categories[1].innerHTML = "💐<br>" + t.bouquets;
    categories[2].innerHTML = "🌼<br>" + t.garlands;
    categories[3].innerHTML = "🌸<br>" + t.jasmine;

    const flowers = document.querySelectorAll(".flower h3");

    flowers[0].innerText = t.redRoses;
    flowers[1].innerText = t.beautifulBouquet;
    flowers[2].innerText = t.flowerGarland;
    flowers[3].innerText = t.jasmine;

    flowers[4].innerText =
        lang === "kn" ? "ದೇವಸ್ಥಾನದ ಹೂವು - 1 ಮಾಲೆ" :
        lang === "hi" ? "मंदिर के फूल - 1 माला" :
        "Temple Flowers - 1 Garland";

    flowers[5].innerText =
        lang === "kn" ? "ದೇವಸ್ಥಾನದ ಹೂವು - 2 ಮಾಲೆ" :
        lang === "hi" ? "मंदिर के फूल - 2 माला" :
        "Temple Flowers - 2 Garlands";

    document.querySelectorAll(".flower button").forEach(function(button) {
        button.innerText = t.add;
    });
} 
      
</script>
  
</body>
</html>
