<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOWER HOUSE - ಹೂವಿನ ಮನೆ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffafc;
      color: #222;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 8px #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 15px;
    }

    .search {
      margin: 20px;
    }

    .search input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    h2 {
      margin: 20px;
    }

    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px;
    }

    .category {
      min-width: 90px;
      background: white;
      padding: 15px 10px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 2px 8px #eee;
    }

    .flowers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 0 20px 30px;
    }

    .flower {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 2px 8px #eee;
    }

    .flower-image {
      height: 120px;
      background: #ffe5ef;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .flower h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌸 FLOWER HOUSE</h1>
    <p>ಹೂವಿನ ಮನೆ</p>
  </header>

  <div class="search">
    <input type="text" placeholder="🔍 ಹೂವು ಹುಡುಕಿ">
  </div>

  <h2>ವಿಭಾಗಗಳು</h2>

  <div class="categories">
    <div class="category">🌹<br>Roses</div>
    <div class="category">💐<br>Bouquets</div>
    <div class="category">🌼<br>Garlands</div>
    <div class="category">🌸<br>Jasmine</div>
  </div>

  <h2>ಜನಪ್ರಿಯ ಹೂವುಗಳು</h2>

  <div class="flowers">

    <div class="flower">
      <div class="flower-image">🌹</div>
      <h3>Red Roses</h3>
      <div class="price">₹199</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">💐</div>
      <h3>Beautiful Bouquet</h3>
      <div class="price">₹399</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">🌼</div>
      <h3>Flower Garland</h3>
      <div class="price">₹149</div>
      <button>Add to Cart</button>
    </div>

    <div class="flower">
      <div class="flower-image">🌸</div>
      <h3>Jasmine</h3>
      <div class="price">₹99</div>
      <button>Add to Cart</button>
    </div>
<div class="flower">
  <div class="flower-image">🌺</div>
  <h3>ದೇವಸ್ಥಾನದ ಹೂವು - 1 ಮೊಳ</h3>
  <div class="price">₹199</div>
  <button>Add to Cart</button>
</div>

<div class="flower">
  <div class="flower-image">🌺</div>
  <h3>ದೇವಸ್ಥಾನದ ಹೂವು - 2 ಮೊಳ</h3>
  <div class="price">₹349</div>
  <button>Add to Cart</button>
</div>
  </div>
  <div style="padding:20px;">
  <h2>ಆರ್ಡರ್ ವಿವರಗಳು</h2>

  <input id="customerName" type="text" placeholder="ನಿಮ್ಮ ಹೆಸರು"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;">

  <input id="customerPhone" type="tel" placeholder="ಮೊಬೈಲ್ ನಂಬರ್"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;">

  <textarea id="customerAddress" placeholder="ಡೆಲಿವರಿ ವಿಳಾಸ"
  style="width:100%;padding:15px;margin:8px 0;box-sizing:border-box;"></textarea>
</div>
<a href="https://wa.me/916362993413?text=Hello%20Flower%20House%2C%20I%20want%20to%20order%20flowers"
   style="display:block;text-align:center;background:#25D366;color:white;padding:15px;margin:20px;border-radius:10px;text-decoration:none;font-size:18px;">
📲 Order on WhatsApp
<script>
let cart = [];

document.querySelectorAll(".flower button").forEach((button) => {
  button.addEventListener("click", () => {
    const flower = button.closest(".flower");
    const name = flower.querySelector("h3").innerText;
    const price = flower.querySelector(".price").innerText;

    cart.push({name, price});

    button.innerText = "Added ✓";
    button.style.background = "#25D366";

    setTimeout(() => {
      button.innerText = "Add to Cart";
      button.style.background = "#111";
    }, 1000);
  });
});

const whatsappButton = document.querySelector('a[href*="wa.me"]');

whatsappButton.addEventListener("click", (e) => {
  e.preventDefault();

  if (cart.length === 0) {
    alert("ಮೊದಲು ಒಂದು Flower Add to Cart ಮಾಡಿ ❤️");
    return;
  }

const customerName = document.getElementById("customerName").value.trim();
const customerPhone = document.getElementById("customerPhone").value.trim();
const customerAddress = document.getElementById("customerAddress").value.trim();

if (!customerName || !customerPhone || !customerAddress) {
  alert("ದಯವಿಟ್ಟು ಹೆಸರು, ಮೊಬೈಲ್ ನಂಬರ್ ಮತ್ತು ವಿಳಾಸ ಹಾಕಿ ❤️");
  return;
}

let message = `🌸 FLOWER HOUSE ORDER 🌸%0A%0A`;
message += `👤 ಹೆಸರು: ${customerName}%0A`;
message += `📱 ಮೊಬೈಲ್: ${customerPhone}%0A`;
message += `📍 ವಿಳಾಸ: ${customerAddress}%0A%0A`;

cart.forEach((item, index) => {
  message += `${index + 1}. ${item.name} - ${item.price}%0A`;
});

message += `%0A❤️ Thank you for ordering!`;

window.open(
  "https://wa.me/916362993413?text=" + message,
  "_blank"
);
});
                  </script>     </a>   
</body>
  </html>
